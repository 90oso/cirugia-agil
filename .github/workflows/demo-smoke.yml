name: Smoke test demo comercial
on:
  push:
    branches: [feat/commercial-demo-2026-10]
  pull_request:
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/demo-http.log 2>&1 &
      - run: node tests/demo-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captura-demo
          path: test-results/
